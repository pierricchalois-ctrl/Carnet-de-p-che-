<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carnet de pêche V2</title><style>body{font-family:-apple-system,sans-serif;background:#f2f5f6;margin:0;color:#17323b}header{background:#075b72;color:white;padding:18px}main{max-width:700px;margin:auto;padding:12px}.card{background:white;border-radius:14px;padding:14px;margin:10px 0}input,select,textarea,button{width:100%;padding:11px;margin:5px 0;border-radius:9px;border:1px solid #ccd7da;box-sizing:border-box}button{background:#075b72;color:white;border:0;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}.take{background:#f5f8f9;padding:10px;border-radius:9px;margin:8px 0}</style></head><body><header><h1>🎣 Carnet de pêche</h1><small>V2 connectée à Supabase</small></header><main>
<div class="grid"><button onclick="show('new')">Nouvelle sortie</button><button onclick="show('history')">Historique</button></div>
<section id="new"><div class="card"><h2>📍 Sortie</h2><div class="grid"><input id="date" type="date"><input id="start" type="time"></div><input id="place" placeholder="Lieu"><button onclick="gps()">📍 Ma position</button><div id="pos">Position non enregistrée</div><button onclick="maps()">🗺️ Apple Maps</button></div>
<div class="card"><h2>🌊 Marée</h2><div class="grid"><select id="tide"><option>Montante</option><option>Descendante</option><option>Pleine mer</option><option>Basse mer</option></select><input id="coef" type="number" placeholder="Coefficient"></div></div>
<div class="card"><h2>☀️ Météo</h2><div class="grid"><input id="temp" type="number" placeholder="Eau °C"><input id="wind" placeholder="Vent"></div><div class="grid"><select id="sea"><option>Calme</option><option>Faible clapot</option><option>Clapot</option><option>Houle</option></select><select id="water"><option>Très claire</option><option>Claire</option><option>Teintée</option><option>Trouble</option></select></div></div>
<div class="card"><h2>🎣 Équipement</h2><select id="rod"><option>DAIWA PROREX E SPINNING PXE 902 HM HFS AF, 10-56 g</option><option>Major Craft Crostage French, 7-35 g</option></select><input id="lures" placeholder="Leurres utilisés, séparés par des virgules"></div>
<div class="card"><h2>🐟 Prises</h2><div id="takes"></div><button onclick="addTake()">+ Ajouter une prise</button></div>
<div class="card"><textarea id="comments" placeholder="Commentaires"></textarea><button onclick="save()">💾 Enregistrer la sortie</button></div></section>
<section id="history" class="hidden"><div class="card"><h2>📚 Historique</h2><div id="list"></div></div></section>
</main><script>
const U="https://ojjjxbsrmpmhstjniysk.supabase.co",K="sb_publishable_ZGZVCbflAHwWiIzg28I9hw_zIIFeXTP";let la=null,lo=null,n=0;
const H={"apikey":K,"Authorization":"Bearer "+K,"Content-Type":"application/json","Prefer":"return=representation"};
function show(x){new Date;document.getElementById("new").classList.toggle("hidden",x!="new");document.getElementById("history").classList.toggle("hidden",x!="history");if(x=="history")load()}
function gps(){navigator.geolocation.getCurrentPosition(p=>{la=p.coords.latitude;lo=p.coords.longitude;pos.textContent="Position : "+la.toFixed(6)+", "+lo.toFixed(6)})}
function maps(){if(la)location.href=`https://maps.apple.com/?ll=${la},${lo}`;else alert("Enregistre ta position d'abord.")}
function addTake(){let id=++n;document.getElementById("takes").insertAdjacentHTML("beforeend",`<div class="take" id="t${id}"><input class="sp" placeholder="Espèce, ex. Bar"><input class="sz" type="number" placeholder="Taille cm"><input class="lu" placeholder="Leurre"><button onclick="document.getElementById('t${id}').remove()">Supprimer</button></div>`)}
function readTakes(){return [...document.querySelectorAll(".take")].map(e=>({species:e.querySelector(".sp").value,size:e.querySelector(".sz").value,lure:e.querySelector(".lu").value}))}
async function req(path,opt={}){let r=await fetch(U+"/rest/v1/"+path,{...opt,headers:H});let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}
async function save(){try{await req("sorties",{method:"POST",body:JSON.stringify({date_sortie:date.value,heure_debut:start.value,lieu:place.value,latitude:la,longitude:lo,maree_phase:tide.value,coefficient:coef.value?+coef.value:null,temperature_eau:temp.value?+temp.value:null,vent:wind.value,etat_mer:sea.value,clarte_eau:water.value,canne:rod.value,leurres:lures.value.split(",").map(x=>x.trim()).filter(Boolean),prises:readTakes(),commentaires:comments.value})});alert("Sortie enregistrée dans Supabase.");show("history")}catch(e){alert("Erreur Supabase : "+e.message)}}
async function load(){list.textContent="Chargement...";try{let a=await req("sorties?select=*&order=created_at.desc");list.innerHTML=a.length?a.map(x=>`<div class="card"><b>${x.date_sortie}</b><br>${x.lieu||""}<br>${x.heure_debut||""} · ${x.maree_phase||""}<br>${(x.prises||[]).map(t=>"🐟 "+t.species+" "+(t.size||"")+" cm · "+(t.lure||"")).join("<br>")||"Aucune prise"}<br>${x.commentaires||""}</div>`).join(""):"Aucune sortie enregistrée."}catch(e){list.textContent="Erreur : "+e.message}}
let d=new Date();date.value=d.toISOString().slice(0,10);start.value=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
</script></body></html>
