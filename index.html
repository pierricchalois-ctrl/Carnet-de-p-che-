<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b72"><title>Carnet de pêche</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f5f6;color:#17323b;margin:0}header{background:#075b72;color:white;padding:18px}main{max-width:650px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0001}h1,h2{margin:0 0 12px}label{display:block;font-size:13px;font-weight:600;margin:9px 0 4px}input,select,textarea,button{font:inherit;width:100%;box-sizing:border-box;border-radius:10px;padding:11px;border:1px solid #ccd7da}button{background:#075b72;color:white;border:0;font-weight:700;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lures{display:grid;grid-template-columns:1fr 1fr;gap:5px}.lures label{background:#eef4f5;padding:8px;border-radius:8px;font-weight:400}.lures input{width:auto}.small{font-size:12px;color:#60747b}.entry{border-top:1px solid #ddd;padding:10px 0}.badge{display:inline-block;background:#e4f0f3;border-radius:15px;padding:4px 7px;margin:3px;font-size:12px}</style></head><body>
<header><h1>🎣 Carnet de pêche</h1><div>Sorties, spots, marées, météo, matériel et prises</div></header><main>
<div class="card"><h2>Nouvelle sortie</h2><div class="grid"><div><label>Date</label><input id="date" type="date"></div><div><label>Heure début</label><input id="start" type="time"></div></div><label>Lieu</label><input id="place" placeholder="Ex. Le Croisic"><label>Position GPS</label><button onclick="gps()">📍 Utiliser ma position</button><div id="pos" class="small">Position non enregistrée</div><button onclick="maps()">🗺️ Ouvrir dans Maps</button></div>
<div class="card"><h2>🌊 Marée</h2><div class="grid"><div><label>Phase</label><select id="tide"><option>Montante</option><option>Descendante</option><option>Pleine mer</option><option>Basse mer</option></select></div><div><label>Coefficient</label><input id="coef" type="number"></div></div><div class="grid"><div><label>Pleine mer</label><input id="high" type="time"></div><div><label>Basse mer</label><input id="low" type="time"></div></div><p class="small">La version suivante pourra remplir ces données automatiquement.</p></div>
<div class="card"><h2>☁️ Météo</h2><div class="grid"><div><label>Température eau</label><input id="temp" type="number"></div><div><label>Vent</label><input id="wind" placeholder="O 15 km/h"></div></div><div class="grid"><div><label>Mer</label><select id="sea"><option>Calme</option><option>Faible clapot</option><option>Clapot</option><option>Houle</option></select></div><div><label>Eau</label><select id="water"><option>Très claire</option><option>Claire</option><option>Teintée</option><option>Trouble</option></select></div></div><p class="small">La version suivante pourra récupérer automatiquement la météo.</p></div>
<div class="card"><h2>🎣 Équipement</h2><label>Canne</label><select id="rod"><option>DAIWA PROREX 10-56 g</option><option>Major Craft Crostage 7-35 g</option><option>Autre</option></select><label>Leurres utilisés</label><div class="lures" id="lures"></div></div>
<div class="card"><h2>🐟 Prise</h2><div class="grid"><div><label>Espèce</label><select id="fish"><option>Bar</option><option>Maquereau</option><option>Vieille</option><option>Orphie</option><option>Autre</option></select></div><div><label>Taille cm</label><input id="size" type="number"></div></div><label>Leurre de la prise</label><input id="catchLure"><label>Heure</label><input id="catchTime" type="time"><label>Commentaires</label><textarea id="comments"></textarea><button onclick="save()">💾 Enregistrer la sortie</button></div>
<div class="card"><h2>📚 Historique</h2><div id="history"></div></div></main>
<script>
const L=["Asturie 130 Ghost Lançon","Asturie 130 Blanc","Patchinko 125 Ghost Lançon","Tide Minnow Specter 135 Ghost Minnow","Flash Minnow 110 SP Ghost Minnow","One Up Shad 4 Solid Chart","One Up Shad 6 Blue","Black Minnow 105 Kaki","Black Minnow 105 Kaki Glitter","Dark Sleeper 3 Mutsugorou","Dark Sleeper 3.8 Pink Back Gill","Super Spindle Worm 4 Wakasagi","Super Spindle Worm 6 Chart Ayu","Super Fluke 5.25","Espetit Soft Jerk 10 Pro Blue","Espetit Soft Shad 10 White Silver Flake","Fiiish Double Combo Offshore 15","Autre"];
let lat="",lon=""; L.forEach(x=>lures.innerHTML+=`<label><input type=checkbox value="${x}"> ${x}</label>`);
function init(){let d=new Date();date.value=d.toISOString().slice(0,10);start.value=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});render()}function gps(){navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude.toFixed(6);lon=p.coords.longitude.toFixed(6);pos.textContent=lat+", "+lon},()=>alert("Position indisponible"))}function maps(){if(lat)location.href=`https://maps.apple.com/?ll=${lat},${lon}`;else alert("Utilise d'abord ma position")}
function save(){let a=JSON.parse(localStorage.peche||"[]"),x={date:date.value,start:start.value,place:place.value,lat,lon,tide:tide.value,coef:coef.value,high:high.value,low:low.value,temp:temp.value,wind:wind.value,sea:sea.value,water:water.value,rod:rod.value,lures:[...document.querySelectorAll('#lures input:checked')].map(e=>e.value),fish:fish.value,size:size.value,catchLure:catchLure.value,catchTime:catchTime.value,comments:comments.value};a.unshift(x);localStorage.peche=JSON.stringify(a);render();alert("Sortie enregistrée")}function render(){let a=JSON.parse(localStorage.peche||"[]");history.innerHTML=a.length?a.map((x,i)=>`<div class=entry><b>${x.date}</b> · ${x.place||"Lieu non renseigné"}<br>${x.tide} · ${x.wind||"Vent non renseigné"}<br>${x.fish||""} ${x.size||""} cm<br>${(x.lures||[]).map(l=>`<span class=badge>${l}</span>`).join("")}<p class=small>${x.comments||""}</p>${x.lat?`<button onclick="location.href='https://maps.apple.com/?ll=${x.lat},${x.lon}'">🗺️ Voir le spot</button>`:""}</div>`).join(""):"<span class=small>Aucune sortie enregistrée.</span>"}init();
</script></body></html>
